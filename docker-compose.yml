services:
  db:
    image: postgis/postgis:16-master
    container_name: rishwat-db
    environment:
      POSTGRES_USER: rishwat
      POSTGRES_PASSWORD: rishwat_dev
      POSTGRES_DB: rishwat
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5434:5432"
    volumes:
      - rishwat_pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rishwat -d rishwat"]
      interval: 5s
      timeout: 3s
      retries: 10

  runner:
    image: node:20-slim
    container_name: rishwat-runner
    working_dir: /app
    volumes:
      - .:/app
      - runner_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgres://rishwat:rishwat_dev@db:5432/rishwat
      TEST_DATABASE_URL: postgres://rishwat:rishwat_dev@db:5432/rishwat_test
      # Local dev only. Must be >= 32 chars: config.ts rejects short or
      # placeholder secrets at boot outside tests. Never reuse this anywhere real.
      JWT_SECRET: local-dev-only-secret-not-for-production-use
      EVIDENCE_STORAGE_DRIVER: local
      EVIDENCE_STORAGE_DIR: ./data/evidence
      PUBLIC_BASE_URL: http://localhost:8787
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  rishwat_pgdata:
  runner_node_modules: