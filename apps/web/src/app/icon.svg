<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Rishwat.fyi">
  <!-- The product's one idea, at 16px: a paired figure. The short bar is the
       official number, the long bar the citizen-reported one, and the space
       between their ends is the gap. Colours are --official and the dark-theme
       --reported, which is the red that holds contrast on deep green. -->
  <rect width="32" height="32" rx="7" fill="#0B3A20" />
  <rect x="7" y="9.5" width="11" height="3.5" rx="1.75" fill="#FCFCFB" />
  <rect x="7" y="19" width="18" height="3.5" rx="1.75" fill="#E8776A" />
</svg>
