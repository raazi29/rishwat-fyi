name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-master
        env:
          POSTGRES_USER: rishwat
          POSTGRES_PASSWORD: rishwat_dev
          POSTGRES_DB: rishwat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rishwat"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # DATABASE_URL and TEST_DATABASE_URL both point at the SAME database — the
    # `rishwat_test` database created by the service container above. The
    # migrate/seed scripts read DATABASE_URL; the vitest suites read
    # TEST_DATABASE_URL. They must be identical so the tests run against the
    # freshly-migrated schema and the seeded reference data (states, districts,
    # services, offices) that packages/database and apps/api assert on.
    env:
      DATABASE_URL: postgres://rishwat:rishwat_dev@localhost:5432/rishwat_test
      TEST_DATABASE_URL: postgres://rishwat:rishwat_dev@localhost:5432/rishwat_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci

      # Typecheck the backend workspaces only. apps/web (the Next.js frontend) is
      # deliberately excluded: its tsconfig `include`s `next-env.d.ts` and
      # `.next/types/**/*.ts`, both of which are generated by the Next.js
      # toolchain and gitignored, so they do not exist on a clean CI checkout.
      # Typechecking the frontend reliably requires a full `next build` first,
      # which is why it lives in the separate `web` job below (which builds
      # first, then typechecks). Scope here: apps/api, packages/database,
      # packages/validation.
      - name: Typecheck (backend workspaces)
        run: npm run typecheck -w apps/api -w packages/database -w packages/validation

      # The service container starts an empty `rishwat_test` database. Prepare it
      # exactly as a developer does locally (README quickstart): enable the
      # required extensions + apply migrations, then seed the reference data. Both
      # scripts read DATABASE_URL (set at the job level, same DB as the tests).
      # migrate.ts creates the postgis, pg_trgm and citext extensions the schema
      # depends on before applying the generated migrations.
      - name: Migrate database (extensions + schema)
        run: npm run db:migrate
      - name: Seed reference data (states / districts / services / offices)
        run: npm run db:seed

      # Run every workspace test suite (apps/api, packages/database,
      # packages/validation). The suites read TEST_DATABASE_URL; JWT_SECRET and
      # the local evidence-storage settings are provided for any code path that
      # loads the full application config.
      - name: Test
        run: npm test
        env:
          JWT_SECRET: ci-test-secret
          EVIDENCE_STORAGE_DRIVER: local
          EVIDENCE_STORAGE_DIR: ./data/evidence-test

  # The frontend (apps/web). Runs with NO database and NO API: apps/web talks to
  # apps/api over HTTP only, and every call goes through src/lib/api/client.ts,
  # which falls back to the bundled sample dataset when the API is unreachable
  # (NEXT_PUBLIC_ALLOW_SAMPLE_FALLBACK defaults to true). So a clean checkout can
  # build all 27 routes with nothing running — hence a plain, service-less job.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # Workspace-root install: apps/web depends on @rishwat/validation, which is
      # only resolvable through the npm workspace links created at the root.
      - run: npm ci

      - name: Lint (apps/web)
        run: npm run lint -w apps/web

      # `npm run build` at the root builds apps/web (see root package.json).
      # Build-time env is deliberately minimal:
      #   - NEXT_PUBLIC_SITE_URL   only affects metadata/sitemap/robots absolute
      #                            URLs; a placeholder keeps the output stable.
      #   - no API_BASE_URL        the API is not running in CI, so every fetch
      #                            fails fast and the sample dataset is rendered.
      #     Do NOT set NEXT_PUBLIC_ALLOW_SAMPLE_FALLBACK=false here: that turns
      #     an unreachable API into a build-breaking error state.
      - name: Build (apps/web)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: https://rishwat.fyi

      # Only meaningful after the build: `next build` generates next-env.d.ts and
      # .next/types/**, both of which apps/web/tsconfig.json includes.
      - name: Typecheck (apps/web)
        run: npm run typecheck -w apps/web

  # The Render deployment artifact. Nothing else in this workflow exercises
  # apps/api/Dockerfile, and it does NOT install the way the jobs above do: it
  # runs a *filtered* workspace install (`npm ci --workspace apps/api
  # --include-workspace-root`) whose ability to pull in @rishwat/database's
  # transitive dependencies is the whole reason that Dockerfile carries fourteen
  # lines of explanation. Without this job, every regression in it — a missing
  # COPY, a lockfile the filtered install rejects, a devDependency that turns out
  # not to be installed — is discovered on Render, in production.
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build context is the repository root, not apps/api — the image has to
      # reproduce the monorepo layout for workspace resolution to work.
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t rishwat-api .

      # Prove the image can actually reach its entrypoint: tsx must be present
      # and every workspace import must resolve. loadConfig() throws on the empty
      # environment here, which is the correct and expected outcome — what is
      # being tested is that we get a *config* error rather than a module
      # resolution error or a missing binary.
      - name: Smoke-test the entrypoint
        run: |
          output=$(docker run --rm rishwat-api 2>&1 || true)
          echo "$output"
          if ! grep -q "Missing/invalid required configuration" <<<"$output"; then
            echo "::error::Container did not reach loadConfig() — the image is broken."
            exit 1
          fi
