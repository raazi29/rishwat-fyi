name: keepalive

# Render free tier sleeps after ~15 min without traffic. The first request after
# a sleep takes 30-50s — longer than the web app's API timeout — so every data
# page renders sample data until the instance is warm. This workflow pings
# /health every 5 min to keep the instance from sleeping. It costs nothing and
# doubles as a minimal uptime check. If you upgrade Render to a paid instance
# (always-on), you can delete this file.
#
# GitHub Actions crons can fire late (up to 10-15 min), so 5-min scheduling
# gives a safety margin against the 15-min sleep window.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping API health
        run: |
          set -e
          echo "GET https://rishwat-fyi.onrender.com/health"
          curl -fsS --max-time 25 https://rishwat-fyi.onrender.com/health | head -c 500
          echo ""
          echo "ok"
